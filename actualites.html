<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VEILLE//INFO — Actualités en live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="data/site-data.js"></script>
<script src="js/common.js"></script>
</head>
<body>
<div id="entete"></div>
<main class="wrap">
  <section class="page-titre">
    <div class="sur-titre">&gt; LIVE FEED</div>
    <h1>Actualités en live</h1>
    <p>Chaque case = un article : titre, résumé de 2-3 lignes et lien vers la source. Triez par jour et par thème.
      Par défaut seuls les articles <b>retenus</b> au triage sont affichés.</p>
  </section>

  <section class="panel filtres" id="filtres">
    <div class="grp" id="themes">
      <label>THÈME</label>
      <button class="f on" data-t="">Tous</button>
      <button class="f H1" data-t="H1">Cybersécurité</button>
      <button class="f H2" data-t="H2">IA</button>
      <button class="f H3" data-t="H3">SecOps</button>
    </div>
    <div class="grp"><label for="jour">JOUR</label><select id="jour"></select></div>
    <div class="grp"><label for="tri">TRI</label>
      <select id="tri"><option value="date">Plus récents</option><option value="score">Plus importants</option></select></div>
    <div class="grp"><label for="vue">AFFICHER</label>
      <select id="vue"><option value="retenu">Retenus</option><option value="tous">Tous (y compris écartés)</option><option value="flash">Flash uniquement</option><option value="signal">Signaux faibles</option></select></div>
    <div class="grp" style="flex:1"><input type="search" id="q" placeholder="Rechercher (ex. VMware, ransomware, agent)…" style="width:100%"></div>
    <div class="compteur" id="nb"></div>
  </section>

  <section id="liste"></section>
  <div style="text-align:center;margin-top:24px"><button class="btn" id="plus" style="display:none">▼ Afficher plus</button></div>
</main>
<div id="pied"></div>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const A = V.articles;
  const qs = new URLSearchParams(location.search);
  const st = { theme: qs.get("theme") || "", jour: qs.get("jour") || "", tri: "date", vue: qs.get("flash") ? "flash" : "retenu", q: "", lim: 60 };
  const jours = [...new Set(A.map(a => a.jour))].sort().reverse();
  document.getElementById("jour").innerHTML = `<option value="">Tous les jours</option>` +
    jours.map(j => `<option value="${j}">${dateLongue(j)} (${A.filter(a => a.jour === j && a.retenu).length})</option>`).join("");
  document.getElementById("jour").value = st.jour;
  document.getElementById("vue").value = st.vue;
  document.querySelectorAll("#themes button").forEach(b => b.classList.toggle("on", b.dataset.t === st.theme));

  const carte = a => {
    const s = SRC[a.source] || { nom: a.source };
    return `<article class="carte bd-${a.horizon} ${a.retenu ? "" : "ecarte"}" style="border-top-color:${HZ[a.horizon].c}">
      <div class="in">
        <div><span class="chip ${a.horizon}">${a.horizon} ${HZ[a.horizon].court}</span>${a.flash ? '<span class="chip flash">⚡ flash</span>' : ""}${a.signal ? '<span class="chip signal">signal faible</span>' : ""}${a.retenu ? "" : '<span class="chip">écarté</span>'}</div>
        <h4>${esc(a.titre)}</h4>
        <p>${esc(a.resume || "—")}</p>
      </div>
      <div class="pied"><span><b>${esc(s.nom)}</b><br>${dateCourte(a.jour)} · ${heure(a.date)}</span>
        <span class="score ${scoreCls(a.score)}" title="Score : source ${a.criteres.source} + criticité ${a.criteres.criticite} + corroboration ${a.criteres.corroboration}${a.criteres.bruit ? " " + a.criteres.bruit + " (bruit)" : ""}">${a.score}</span>
        <a class="lire" href="${esc(a.lien)}" target="_blank" rel="noopener">LIRE ▸</a></div>
    </article>`;
  };

  function rendu() {
    const q = st.q.toLowerCase();
    let l = A.filter(a => (!st.theme || a.horizon === st.theme) && (!st.jour || a.jour === st.jour)
      && (st.vue === "tous" || (st.vue === "retenu" && a.retenu) || (st.vue === "flash" && a.flash) || (st.vue === "signal" && a.signal))
      && (!q || (a.titre + " " + a.resume + " " + (SRC[a.source]?.nom || "")).toLowerCase().includes(q)));
    l.sort(st.tri === "score" ? (a, b) => b.score - a.score || b.date.localeCompare(a.date) : (a, b) => b.date.localeCompare(a.date));
    document.getElementById("nb").textContent = `${l.length} article(s)`;
    const vis = l.slice(0, st.lim);
    let html = "";
    if (st.tri === "date") {
      const g = {}; vis.forEach(a => (g[a.jour] = g[a.jour] || []).push(a));
      html = Object.keys(g).sort().reverse().map(j => `<div class="jour-titre">${dateLongue(j).toUpperCase()} · ${g[j].length}</div><div class="cartes">${g[j].map(carte).join("")}</div>`).join("");
    } else html = `<div class="cartes mt">${vis.map(carte).join("")}</div>`;
    document.getElementById("liste").innerHTML = html || `<div class="panel mt vide">Aucun article ne correspond à ces filtres.</div>`;
    document.getElementById("plus").style.display = l.length > st.lim ? "inline-block" : "none";
  }
  document.querySelectorAll("#themes button").forEach(b => b.addEventListener("click", () => {
    st.theme = b.dataset.t; st.lim = 60;
    document.querySelectorAll("#themes button").forEach(x => x.classList.toggle("on", x === b)); rendu();
  }));
  ["jour", "tri", "vue"].forEach(id => document.getElementById(id).addEventListener("change", e => { st[id] = e.target.value; st.lim = 60; rendu(); }));
  document.getElementById("q").addEventListener("input", e => { st.q = e.target.value; rendu(); });
  document.getElementById("plus").addEventListener("click", () => { st.lim += 60; rendu(); });
  rendu();
});
</script>
</body>
</html>
