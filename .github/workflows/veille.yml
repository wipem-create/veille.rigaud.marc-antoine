# Collecte automatique + publication du site sur GitHub Pages.
# - Automatique : 7h puis toutes les 2 h jusqu'à 19h (heure de Paris, été/hiver gérés)
# - Manuel      : bouton « ▶ Collecter » du site (ou onglet Actions → Run workflow)
# - Push        : republie le site quand vous poussez une nouvelle version
# Réglages GitHub requis : Settings → Pages → Source = « GitHub Actions »
#                          Settings → Actions → General → Workflow permissions = « Read and write »
name: veille-collecte
on:
  schedule:
    - cron: "0 5-18 * * *"
  workflow_dispatch: {}
  push:
    branches: [main, master]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: veille
  cancel-in-progress: false
jobs:
  collecte:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Créneau de collecte ?
        id: creneau
        run: |
          H=$((10#$(TZ=Europe/Paris date +%H)))
          GO=0
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then GO=1; fi
          if [ "${{ github.event_name }}" = "schedule" ] && [ $H -ge 7 ] && [ $H -le 19 ] && [ $(( (H - 7) % 2 )) -eq 0 ]; then GO=1; fi
          echo "go=$GO" >> "$GITHUB_OUTPUT"
          echo "Heure de Paris : ${H}h — collecte : $GO"

      - name: Itération de veille
        if: steps.creneau.outputs.go == '1'
        run: python veille.py collect

      - name: Enregistrer les données dans le dépôt
        if: steps.creneau.outputs.go == '1'
        run: |
          git config user.name "veille-bot"
          git config user.email "veille-bot@users.noreply.github.com"
          git add data/
          git commit -m "Veille : itération $(TZ=Europe/Paris date '+%d/%m/%Y %H:%M')" || echo "Rien de nouveau"
          git pull --rebase --autostash || true
          git push

      - name: Préparer GitHub Pages
        if: steps.creneau.outputs.go == '1' || github.event_name == 'push'
        uses: actions/configure-pages@v5
      - name: Envoyer le site
        if: steps.creneau.outputs.go == '1' || github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publier
        id: deploiement
        if: steps.creneau.outputs.go == '1' || github.event_name == 'push'
        uses: actions/deploy-pages@v4
